# Configuração C — ConvNeXt-T + FiLM sobre embedding CLIP-text (512-dim)
# Cap. 4, §4.7. Alternativa moderna com prompt ensembling
etapa: 3
config_id: C
title: "ConvNeXt-T + FiLM (sinal via CLIP-text embedding 512-dim)"
backbone:
  name: convnext_tiny
  pretrained: imagenet1k
conditioning:
  type: film
  cond_dim: 512
  cond_source: clip_text_ensemble
  clip:
    model: openai/clip-vit-base-patch16
    n_templates: 10
    template: "a photo of a person with Monk Skin Tone {k}"
    weight_by_mst_softmax: true  # softmax vem do classificador MST da Etapa 1
  film_mlp_hidden: 256
  init_identity: true
hyperparams: !include ../common/hyperparams.yaml
seeds: !include ../common/seeds.yaml
outputs:
  metrics: outputs/etapa3/C_film_clip/metrics_seed{seed}.json
  checkpoint: outputs/etapa3/C_film_clip/model_seed{seed}.pt
