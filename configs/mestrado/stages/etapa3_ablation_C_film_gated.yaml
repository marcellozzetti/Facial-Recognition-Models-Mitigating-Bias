# Configuração C — FiLM com porta multiplicativa (gating sigmoide)
# Cap. 4, §4.7. Variante interna, inspirada em Dumoulin et al. (2018)
etapa: 3
config_id: C
title: "ConvNeXt-T + FiLM gated (MST 10-dim)"
backbone:
  name: convnext_tiny
  pretrained: imagenet1k
conditioning:
  type: film_gated
  cond_dim: 10
  cond_source: skintonenet_softmax
  film_mlp_hidden: 128
  gate_activation: sigmoid
  init_identity: true
hyperparams: !include ../common/hyperparams.yaml
seeds: !include ../common/seeds.yaml
outputs:
  metrics: outputs/etapa3/C_film_gated/metrics_seed{seed}.json
  checkpoint: outputs/etapa3/C_film_gated/model_seed{seed}.pt
