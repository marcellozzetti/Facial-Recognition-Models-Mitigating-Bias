# Configuração B — ConvNeXt-T + FiLM com MST 10-dim (PROPOSTA PRINCIPAL)
# Cap. 4, §4.7 e §4.6
etapa: 3
config_id: B
title: "ConvNeXt-T + FiLM (sinal MST 10-dim direto)"
backbone:
  name: convnext_tiny
  pretrained: imagenet1k
conditioning:
  type: film
  cond_dim: 10
  cond_source: mst_classifier_softmax  # da Etapa 1 (classificador próprio)
  film_mlp_hidden: 128
  init_identity: true
hyperparams: !include ../common/hyperparams.yaml
seeds: !include ../common/seeds.yaml
outputs:
  metrics: outputs/etapa3/B_film_mst/metrics_seed{seed}.json
  checkpoint: outputs/etapa3/B_film_mst/model_seed{seed}.pt
